<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zettel Garden</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  
  <!-- Wikilinks (Obsidian-style) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-wikilink@1"></script>

  <!-- YAML parser -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

 <script>
  window.$docsify = {
    name: 'Zettel Garden',
    repo: 'https://github.com/MariaScetta/zettel-garden',
    loadSidebar: true,
    subMaxLevel: 2,
    homepage: 'README.md',
    plugins: [
      window.DocsifyWikiLinks
    ]
  }

  function frontmatterAndPublishGate(hook, vm) {
    hook.beforeEach(function (content) {
      // 1) Estrai + rimuovi YAML frontmatter (così non si vede mai)
      let fm = {};
      const m = content.match(/^---\n([\s\S]*?)\n---\n?/);

      if (m) {
        try {
          fm = window.jsyaml.load(m[1]) || {};
        } catch (e) {
          fm = {};
        }
        content = content.slice(m[0].length);
      }

      // 2) Se publish === false -> "nascondi" la pagina
      // (default: visibile)
      if (fm.publish === false) {
        return `# 404
        Questa pagina non è pubblicata.

        [Torna alla home](README.md)`;
      }

      return content;
    });
  }

  window.$docsify = window.$docsify || {};
  window.$docsify.plugins = (window.$docsify.plugins || []).concat(frontmatterAndPublishGate);
</script>

</body>
</html>
