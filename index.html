<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zettel Garden</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  
  <!-- Plugin wikilinks -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-wikilinks/dist/docsify-wikilinks.min.js"></script>

 <script>
  window.$docsify = {
    name: 'Zettel Garden',
    repo: 'https://github.com/MariaScetta/zettel-garden',
    loadSidebar: true,
    subMaxLevel: 2,
    homepage: 'README.md',
    plugins: [
      window.DocsifyWikiLinks
    ]
  }
</script>

</body>
</html>
